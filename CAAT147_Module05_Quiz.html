    color: #1b5e20;

  .answer-tag.wrong-tag {

    color: #ffffff;

    text-align: center;
    color: #ffffff;

  .score-panel.red { background: #c62828; }

let quizSet = [];
let userAnswers = {};
let submitted = false;
let currentFilter = 'all';

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildQuizSet() {
  const shuffledQuestions = shuffle(RAW_QUESTIONS);
  quizSet = shuffledQuestions.map(q => {
    const optionIndices = shuffle([0, 1, 2]);
    const options = optionIndices.map(idx => q.options[idx]);
    const newCorrectIndex = optionIndices.indexOf(q.correct);
    return {
      id: q.id,
      stem: q.stem,
      options: options,
      correct: newCorrectIndex
    };
  });
}

function initQuiz() {
  buildQuizSet();
  userAnswers = {};
  submitted = false;
  currentFilter = 'all';
  document.getElementById('resultArea').innerHTML = '';
  document.getElementById('filterArea').classList.add('hidden');
  document.getElementById('submitBtn').disabled = false;
  document.getElementById('submitBtn').textContent = 'ส่งคำตอบ';
  document.getElementById('scoreLiveText').textContent = '';
  renderQuiz();
  updateProgress();
  window.scrollTo(0, 0);
}

const letters = ['A', 'B', 'C'];

function renderQuiz() {
  const area = document.getElementById('quizArea');
  let html = '';
  quizSet.forEach((q, qi) => {
    let cardClass = 'question-card';
    if (submitted) {
      const isCorrect = userAnswers[qi] === q.correct;
      cardClass += isCorrect ? ' correct' : ' incorrect';
    }
    if (submitted && currentFilter === 'wrong' && userAnswers[qi] === q.correct) return;
    if (submitted && currentFilter === 'correct' && userAnswers[qi] !== q.correct) return;

    html += `<div class="${cardClass}" data-qi="${qi}">`;
    html += `<div class="q-number">ข้อที่ ${qi + 1} / ${quizSet.length}</div>`;
    html += `<div class="q-stem">${escapeHtml(q.stem)}</div>`;

    q.options.forEach((opt, oi) => {
      let optClass = 'option';
      if (submitted) {
        optClass += ' locked';
        if (oi === q.correct) optClass += ' answer-correct';
        else if (oi === userAnswers[qi]) optClass += ' answer-wrong-selected';
      } else {
        if (userAnswers[qi] === oi) optClass += ' selected';
      }
      html += `<div class="${optClass}" onclick="selectOption(${qi}, ${oi})">
        <div class="option-letter">${letters[oi]}</div>
        <div>${escapeHtml(opt)}</div>
      </div>`;
    });

    if (submitted) {
      const isCorrect = userAnswers[qi] === q.correct;
      if (isCorrect) {
        html += `<div class="answer-tag correct-tag">✓ ตอบถูก</div>`;
      } else {
        html += `<div class="answer-tag wrong-tag">✗ ตอบผิด &mdash; เฉลย: ${letters[q.correct]}. ${escapeHtml(q.options[q.correct])}</div>`;
      }
    }

    html += `</div>`;
  });

  if (submitted && html === '') {
    html = '<div class="empty-note">ไม่มีข้อที่ตรงกับตัวกรองนี้</div>';
  }

  area.innerHTML = html;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function selectOption(qi, oi) {
  if (submitted) return;
  userAnswers[qi] = oi;
  renderQuiz();
  updateProgress();
}

function updateProgress() {
  const answered = Object.keys(userAnswers).length;
  const total = quizSet.length;
  document.getElementById('progressText').textContent = `${answered} / ${total} ข้อ`;
  document.getElementById('progressFill').style.width = total ? `${(answered / total) * 100}%` : '0%';
}

function computeScore() {
  let correctCount = 0;
  quizSet.forEach((q, qi) => {
    if (userAnswers[qi] === q.correct) correctCount++;
  });
  return correctCount;
}

function submitQuiz() {
  const total = quizSet.length;
  const answered = Object.keys(userAnswers).length;
  if (answered < total) {
    const remaining = total - answered;
    if (!confirm(`ยังตอบไม่ครบ ${remaining} ข้อ ต้องการส่งคำตอบเลยหรือไม่?`)) {
      return;
    }
  }
  submitted = true;
  const correctCount = computeScore();
  const total2 = quizSet.length;
  const pct = total2 ? Math.round((correctCount / total2) * 1000) / 10 : 0;

  let colorClass = 'red';
  if (pct >= 80) colorClass = 'green';
  else if (pct >= 60) colorClass = 'yellow';

  const resultHtml = `
    <div class="score-panel ${colorClass}">
      <div class="score-sub">คะแนนของคุณ</div>
      <div class="score-percent">${pct}%</div>
      <div class="score-sub">ตอบถูก ${correctCount} จาก ${total2} ข้อ</div>
    </div>
  `;
  document.getElementById('resultArea').innerHTML = resultHtml;
  document.getElementById('filterArea').classList.remove('hidden');
  document.getElementById('submitBtn').disabled = true;
  document.getElementById('scoreLiveText').textContent = `คะแนน: ${pct}%`;

  document.getElementById('cntAll').textContent = total2;
  document.getElementById('cntWrong').textContent = total2 - correctCount;
  document.getElementById('cntCorrect').textContent = correctCount;

  currentFilter = 'all';
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.filter-btn[data-filter="all"]').classList.add('active');

  renderQuiz();
  document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth' });
}

document.getElementById('submitBtn').addEventListener('click', submitQuiz);
document.getElementById('restartBtn').addEventListener('click', () => {
  if (submitted || Object.keys(userAnswers).length > 0) {
    if (!confirm('ต้องการเริ่มทำใหม่และสุ่มคำถามใหม่ทั้งหมดหรือไม่?')) return;
  }
  initQuiz();
});

document.getElementById('filterArea').addEventListener('click', (e) => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  currentFilter = btn.dataset.filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderQuiz();
});

initQuiz();
</script>
</body>
</html>
