<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แบบทดสอบ Module 2 — Physics</title>
<style>
  :root{
    --bg:#ffffff; --fg:#000000; --muted:#555; --line:#ddd;
    --green:#2e7d32; --green-bg:#e8f5e9;
    --yellow:#b28704; --yellow-bg:#fff8e1;
    --red:#c62828; --red-bg:#ffebee;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--fg); font-family:"Segoe UI", Tahoma, sans-serif; line-height:1.5;}
  .wrap{max-width:860px; margin:0 auto; padding:16px 14px 120px;}
  header{border-bottom:2px solid #000; padding:14px 0 12px; margin-bottom:14px;}
  header h1{font-size:1.35rem;}
  header p{color:var(--muted); font-size:.9rem; margin-top:4px;}
  .badge{display:inline-block; border:1px solid #000; border-radius:999px; padding:2px 10px; font-size:.8rem; margin-right:6px; margin-top:8px;}
  /* progress */
  .progress-outer{background:#eee; border:1px solid var(--line); border-radius:999px; height:10px; overflow:hidden; margin:8px 0;}
  .progress-inner{background:#000; height:100%; width:0%; transition:width .2s;}
  /* question card */
  .qcard{border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px;}
  .qcard .qno{font-weight:700; font-size:.8rem; color:var(--muted);}
  .qcard .qtext{font-weight:600; margin:6px 0 10px;}
  .opt{display:flex; align-items:flex-start; gap:8px; border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-bottom:6px; cursor:pointer;}
  .opt:hover{background:#f5f5f5;}
  .opt input{margin-top:3px; accent-color:#000;}
  .opt.correct{background:var(--green-bg); border-color:var(--green);}
  .opt.wrong{background:var(--red-bg); border-color:var(--red);}
  .qcard.is-correct{border-left:6px solid var(--green);}
  .qcard.is-wrong{border-left:6px solid var(--red);}
  .explain{margin-top:10px; border-top:1px dashed var(--line); padding-top:8px; font-size:.9rem;}
  .explain .tag{font-weight:700;}
  .explain .tag.ok{color:var(--green);} .explain .tag.no{color:var(--red);}
  /* bottom bar */
  .bottombar{position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:2px solid #000; padding:10px 14px; display:flex; align-items:center; gap:12px; z-index:50;}
  .bottombar .inner{max-width:860px; margin:0 auto; width:100%; display:flex; align-items:center; gap:12px;}
  .btn{border:2px solid #000; background:#000; color:#fff; padding:10px 18px; border-radius:8px; font-size:1rem; cursor:pointer; font-weight:700;}
  .btn.ghost{background:#fff; color:#000;}
  .btn:active{transform:translateY(1px);}
  /* result */
  .result{border:2px solid #000; border-radius:12px; padding:18px; margin-bottom:16px; display:none;}
  .score-big{font-size:2.4rem; font-weight:800;}
  .bar-outer{background:#eee; border:1px solid var(--line); height:22px; border-radius:999px; overflow:hidden; margin:10px 0;}
  .bar-inner{height:100%; width:0%; transition:width .6s;}
  .bar-green{background:var(--green);} .bar-yellow{background:#f4c400;} .bar-red{background:var(--red);}
  .stat-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:6px;}
  .filters{display:flex; gap:8px; margin:14px 0; flex-wrap:wrap;}
  .fbtn{border:1.5px solid #000; background:#fff; color:#000; padding:7px 14px; border-radius:999px; cursor:pointer; font-weight:600;}
  .fbtn.active{background:#000; color:#fff;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📘 แบบทดสอบ Module 2 — Physics</h1>
    <p>สุ่มลำดับข้อและตัวเลือกใหม่อัตโนมัติทุกครั้ง • เฉลย+คำอธิบายหลังส่งคำตอบ</p>
    <span class="badge">ทั้งหมด <b id="totalCount1">0</b> ข้อ</span>
    <span class="badge">เกณฑ์ผ่าน ≥ 80%</span>
  </header>

  <!-- ผลคะแนน -->
  <div class="result" id="resultBox">
    <div>คะแนนของคุณ</div>
    <div class="score-big" id="scoreText">0%</div>
    <div class="bar-outer"><div class="bar-inner" id="scoreBar"></div></div>
    <div class="stat-row">
      <span class="badge">✅ ถูก <b id="correctCount">0</b></span>
      <span class="badge">❌ ผิด <b id="wrongCount">0</b></span>
      <span class="badge">เต็ม <b id="totalCount2">0</b> ข้อ</span>
    </div>
    <div class="filters">
      <button class="fbtn active" data-f="all">ทั้งหมด (<span id="fAll">0</span>)</button>
      <button class="fbtn" data-f="wrong">❌ ดูเฉพาะข้อผิด (<span id="fWrong">0</span>)</button>
      <button class="fbtn" data-f="correct">✅ ดูเฉพาะข้อถูก (<span id="fCorrect">0</span>)</button>
    </div>
    <button class="btn" id="retryBtn">🔄 ทำใหม่ (สุ่มใหม่ทั้งหมด)</button>
  </div>

  <div id="quiz"></div>
</div>

<div class="bottombar" id="bottomBar">
  <div class="inner">
    <div style="flex:1">
      <div style="font-size:.85rem">ตอบแล้ว <b id="answeredCount">0</b> / <span id="totalCount3">0</span> ข้อ</div>
      <div class="progress-outer"><div class="progress-inner" id="progBar"></div></div>
    </div>
    <button class="btn" id="submitBtn">ส่งคำตอบ</button>
  </div>
</div>

/* ================= ตัวแปรสถานะ ================= */
let quiz=[], userAnswers=[], submitted=false, currentFilter="all";

const $=id=>document.getElementById(id);

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

/* สร้างชุดข้อสอบใหม่: สุ่มลำดับข้อ + สุ่มตัวเลือก */
function buildQuiz(){
  quiz=DATA.map(d=>({q:d[0],opts:[...d[1]],ans:d[2],exp:d[3]}));
  shuffle(quiz);
  quiz.forEach(q=>{
    const correctText=q.opts[q.ans];
    shuffle(q.opts);
    q.ans=q.opts.indexOf(correctText);
  });
  userAnswers=new Array(quiz.length).fill(null);
  submitted=false;
  currentFilter="all";
}

/* เรนเดอร์ข้อสอบ */
function render(){
  const box=$("quiz");
  box.innerHTML="";
  quiz.forEach((q,qi)=>{
    const card=document.createElement("div");
    card.className="qcard";
    card.id="card-"+qi;
    let optsHtml="";
    q.opts.forEach((opt,oi)=>{
      optsHtml+=`
      <label class="opt" id="opt-${qi}-${oi}">
        <input type="radio" name="q${qi}" value="${oi}" ${userAnswers[qi]===oi?"checked":""}>
        <span>${String.fromCharCode(65+oi)}. ${opt}</span>
      </label>`;
    });
    card.innerHTML=`
      <div class="qno">ข้อที่ ${qi+1} / ${quiz.length}</div>
      <div class="qtext">${q.q}</div>
      ${optsHtml}
      <div class="explain hidden" id="exp-${qi}"></div>`;
    box.appendChild(card);
    card.querySelectorAll("input").forEach(inp=>{
      inp.addEventListener("change",()=>{
        if(submitted)return;
        userAnswers[qi]=parseInt(inp.value);
        updateProgress();
      });
    });
  });
  updateCounts();
  updateProgress();
}

/* อัปเดตตัวเลขจำนวนข้อ + ความคืบหน้า (อัตโนมัติจากข้อมูล) */
function updateCounts(){
  const total=quiz.length;
  $("totalCount1").textContent=total;
  $("totalCount2").textContent=total;
  $("totalCount3").textContent=total;
}

function updateProgress(){
  const answered=userAnswers.filter(a=>a!==null).length;
  $("answeredCount").textContent=answered;
  $("progBar").style.width=(quiz.length?answered/quiz.length*100:0)+"%";
}

/* ส่งคำตอบ + คำนวณคะแนน */
function submit(){
  const answered=userAnswers.filter(a=>a!==null).length;
  if(answered<quiz.length){
    if(!confirm(`คุณยังตอบไม่ครบ (${answered}/${quiz.length} ข้อ)\nข้อที่ไม่ได้ตอบจะถือว่าผิด — ต้องการส่งเลยหรือไม่?`))return;
  }
  submitted=true;
  let correct=0;
  quiz.forEach((q,qi)=>{
    const card=$("card-"+qi);
    const user=userAnswers[qi];
    const isCorrect=user===q.ans;
    if(isCorrect)correct++;
    card.classList.add(isCorrect?"is-correct":"is-wrong");
    card.dataset.result=isCorrect?"correct":"wrong";
    /* ไฮไลต์ตัวเลือก */
    q.opts.forEach((_,oi)=>{
      const el=$(`opt-${qi}-${oi}`);
      el.querySelector("input").disabled=true;
      if(oi===q.ans)el.classList.add("correct");
      else if(oi===user)el.classList.add("wrong");
    });
    /* เฉลย + คำอธิบาย */
    const exp=$("exp-"+qi);
    exp.classList.remove("hidden");
    exp.innerHTML=`
      <span class="tag ${isCorrect?"ok":"no"}">${isCorrect?"✅ ถูกต้อง":"❌ ผิด"}</span>
      &nbsp;เฉลย: <b>${String.fromCharCode(65+q.ans)}. ${q.opts[q.ans]}</b>
      ${user===null?" <i>(ไม่ได้ตอบ)</i>":""}
      <br><span style="color:var(--muted)">💡 ${q.exp}</span>`;
  });

  const total=quiz.length;
  const wrong=total-correct;
  const pct=total?Math.round(correct/total*100):0;

  $("scoreText").textContent=pct+"%";
  const bar=$("scoreBar");
  bar.className="bar-inner "+(pct>=80?"bar-green":pct>=60?"bar-yellow":"bar-red");
  bar.style.width=pct+"%";
  $("scoreText").style.color=pct>=80?"var(--green)":pct>=60?"var(--yellow)":"var(--red)";
  $("correctCount").textContent=correct;
  $("wrongCount").textContent=wrong;
  $("fAll").textContent=total;
  $("fCorrect").textContent=correct;
  $("fWrong").textContent=wrong;

  $("resultBox").style.display="block";
  $("submitBtn").textContent="🔄 ทำใหม่";
  window.scrollTo({top:0,behavior:"smooth"});
  applyFilter("all");
}

/* กรองข้อ ถูก/ผิด */
function applyFilter(f){
  currentFilter=f;
  document.querySelectorAll(".fbtn").forEach(b=>b.classList.toggle("active",b.dataset.f===f));
  quiz.forEach((_,qi)=>{
    const card=$("card-"+qi);
    const res=card.dataset.result;
    card.classList.toggle("hidden",!(f==="all"||f===res));
  });
}

/* ทำใหม่: รีเซ็ต + สุ่มใหม่ทั้งหมด */
function retry(){
  buildQuiz();
  render();
  $("resultBox").style.display="none";
  $("submitBtn").textContent="ส่งคำตอบ";
  window.scrollTo({top:0,behavior:"smooth"});
}

/* เหตุผลของปุ่ม */
$("submitBtn").addEventListener("click",()=>{
  if(submitted)retry(); else submit();
});
$("retryBtn").addEventListener("click",retry);
document.querySelectorAll(".fbtn").forEach(b=>b.addEventListener("click",()=>applyFilter(b.dataset.f)));

/* เริ่มต้น */
buildQuiz();
render();
</script>
