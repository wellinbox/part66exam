{q:"The method of ascertaining the voltage of a standard aircraft lead-acid battery is by checking",o:["the voltage with rated load switched ON","the voltage on open circuit","the voltage off load"],a:2,e:"If just checking the voltage (as opposed to a charge test) then the battery must be off load to prevent the internal resistance dropping the terminal voltage."},

{q:"If a battery has got low internal resistance, then the",o:["no load voltage will be the same as on load voltage","on load voltage will be greater than no load voltage","no load voltage will be greater than on load voltage"],a:2,e:"The internal resistance will always drop the voltage and reduce the terminal voltage. It is the same whether it is high or low internal resistance - just a matter of 'how much'."},

{q:"The voltage of a secondary cell is",o:["determined by the active materials on the plates","determined by the number of plates","determined by the area of the plates"],a:0,e:"Voltage of a battery is determined by what the plates are made from, and how many plates are in series. However, a 'cell' is not a battery and can only ever have two plates."},
{q:"What is the ampere-hour rating of a storage battery that is designed to deliver 45 amperes for 2.5 hours?",o:["112.5 ampere-hour","90.0 ampere-hour","45.0 ampere-hour"],a:0,e:"Ampere.hours means amps * hours."},
{q:"If a nicad battery is not to be used immediately it should be stored",o:["dry","fully charged","fully dissipated"],a:2,e:"Ni-cad batteries must be stored fully discharged. Often with a metal bar across their terminals to ensure they are fully dissipated."},

{q:"Power is the rate of doing work. It is measured in",o:["joules/second","joules * seconds","watts/second"],a:0,e:"NIL"},
{q:"The power in a circuit when voltage and resistance is given can be found by",o:["V * R","V * V * R","V * V / R"],a:2,e:"Power = V²/R."},
{q:"A 500 ohm resistor carries a 3 amp current. What is the power dissipated?",o:["500 W","5 kW","4.5 kW"],a:2,e:"Power = I²R."},

{q:"A 48-volt source is required to furnish 192 watts to a parallel circuit consisting of three resistors of equal value. What is the value of each resistor?",o:["4 ohm","36 ohm","12 ohm"],a:1,e:"Each resistor dissipates 192/3 = 64 Watts. Voltage is the same across all resistors in parallel = 48 Volts. Power = V-squared/R. Work out R."},

{q:"A direct current of 12 milliamperes flows through a circuit which has a resistance of 1000 ohms. The power dissipated by the circuit is",o:["144 milliwatts","12 watts","12 milliwatts"],a:0,e:"Power = I²R. Watch the prefix 'milli'. 'Milli' means divide by 1000. Square it and you must divide by 1,000,000."},

"11. Inductance/inductor": [
{q:"Two inductive coils are placed in close proximity with each other at 90 degrees. The number of flux linkages is",o:["0","maximum negative","maximum positive"],a:0,e:"The coils must be parallel for maximum flux linkages (coupling factor). Coupling factor reduces as angular difference increases to."},
{q:"What is the mutual inductance if two coils of 10mH and 500mH have 90% of the flux transferred from one to the other?",o:["459mH","4.5mH","63mH"],a:2,e:"Total inductance = 0.9 * root * 10 * 500 = 63."},
{q:"An inductor has 1,000 turns of wire and a cross sectional area of 0.001m². If the core has a permeability of 0.000,001 and the coil is 0.1m. What is the value of the inductor?",o:["100microH","100mH","10mH"],a:2,e:"0.000001 * 1000 * 0.001 / 0.1 = 0.01 = 10 mH."},
{q:"Three inductors 10 mH, 5 mH and 20 mH are connected in parallel. What is the total inductance?",o:["Without knowing the coupling factor the total inductance cannot be found","2.86mH","35mH"],a:1,e:"In parallel, the total inductance is lower than the lowest single inductance."},
{q:"If the current reaches a maximum through an inductor of 2A in 15 seconds, what is the current after 3 seconds?",o:["1.26A","0.63A","1A"],a:0,e:"1 time constant = 15/5 = 3s. 100% charge = 2A, so 1 time constant (63.2%) = 1.26A."},
{q:"The time constant of an inductor is",o:["L/R","L²/R","LR"],a:0,e:"NIL"},
{q:"If the rate of change of current is halved, mutual inductance will",o:["stay the same","halve","double"],a:0,e:"Get the formula for mutual inductance. Rate of change of current (i.e. frequency) is not in it."},
{q:"Why are the iron cores of most induction coils laminated?",o:["To reduce the effects of eddy currents","To reduce the core reluctance","To increase the core permeability"],a:0,e:"NIL"},
{q:"When more than two inductors of different inductance are connected in parallel in a circuit, the total inductance is",o:["equal to the sum of the individual inductance","equal to the inductance of the highest rated inductor","less than the inductance of the lowest rated inductor"],a:2,e:"Adding inductors in parallel is the same formula as resistors in parallel (i.e. adding an inductor actually decreases the inductance)."},
{q:"The time constant in an inductive circuit is the time required for the current to reach",o:["70.7% of maximum value","63.2% of maximum value","63.7% of maximum value"],a:1,e:"NIL"},
{q:"An AC inductive circuit has an inductance 0f 10 mH and a frequency input of 1000Hz. The opposition to current flow is approximately",o:["63 ohms","63,000 ohms","630 ohms"],a:0,e:"Inductive reactance is 2pi * f * L = 6.28 * 1000 * 10/1000 = 62.8 ohms."},
{q:"Rotating coil B through 90° will",o:["increase the EMF induced into B","increase the EMF induced into A","decrease the EMF induced into B"],a:2,e:"Coupling factor is maximum when the coils are parallel. It is zero if they are at 90° to each other."},
{q:"An inductor of resistance 5 kΩ and inductance 2mH is connected to a DC circuit. The time constant is",o:["400 ns","10 seconds","40 ms"],a:0,e:"Time constant = L/R = 2mH/5000 = 0.000,000,4 seconds = 400 ns."},
{q:"When switching off the supply, the back EMF in a collapsing field in an inductor",o:["can be multiple times bigger than forward EMF","never exceeds forward EMF","is equal to forward EMF"],a:0,e:"The size of the back-emf depends upon how fast the magnetic field is collapsing. That is how your car ignition turns 12V into several thousand volts."},
{q:"An induced current in a coil",o:["opposes the EMF producing it","does not affect the EMF producing it","aids the EMF producing it"],a:0,e:"The induced current in a coil (inductor) opposes the current which produces it."},

"12. DC Motor/Generator Theory": [
{q:"In a DC motor, the stator's magnetic field, due to armature reaction, moves",o:["in the same direction of rotation of the armature","in the opposite direction of rotation of the armature","into alignment with the GNA"],a:1,e:"NIL"},
{q:"A small air gap between magnetic poles results",o:["in a weaker field than a large air gap, for the same magnetising force","in a stronger field than a large air gap, for the same magnetising force","in the same field as a large air gap, for the same magnetising force"],a:2,e:"Magnetic field (number of flux lines) is the same regardless of distance between poles. However, the field density (flux density) will increase with a smaller air gap."},
{q:"The electromagnetic brake coil in an actuator would be energised",o:["only at the instant of starting and stopping","all the time in flight","only when the actuator is running"],a:2,e:"NIL"},
{q:"In a shunt wound direct current motor with a constant voltage field supply, the torque developed by the motor is",o:["independent of load","directly proportional to armature current","inversely proportional to the armature current"],a:1,e:"NIL"},
{q:"Decreasing the field current in a shunt motor will",o:["decrease speed and increase torque","increase speed and increase torque","increase speed and decrease torque"],a:1,e:"Decreasing the field current in a shunt motor will reduce the back emf in the armature so the armature current will increase giving a rise in torque and the RPM will increase as a consequence."},
{q:"To calculate generator output you need to know the",o:["armature speed and number of series conductors","armature speed and field strength","armature speed and number of parallel conductors"],a:1,e:"NIL"},

{q:"A starter generator has a",o:["low resistance series field and a low resistance shunt field","low resistance series field and a high resistance shunt field","high resistance series field and a low resistance shunt field"],a:1,e:"NIL"},
{q:"If the brake coil on an actuator motor goes open circuit, the actuator will",o:["run slower","stop","over-ride its mechanical stops"],a:1,e:"The brake coil is wired in series with the actuator motor coil. It withdraws a spring loaded lock to release the actuator when current is applied."},
{q:"The diagram shows a 200 V long shunt generator. What is the voltage dropped across the series resistor?",o:["0.12 V","0.2 V","200 V"],a:0,e:"Don't let the field configuration confuse you. The 0.04 and 100 ohm resistors are part of the generator and can be ignored. Just consider the 0.06 ohm (the series resistor) and the load resistor. Calculate current (about 2A) then calculate voltage across 0.06 ohm resistor."},
{q:"If a generator speed is halved and the field strength is doubled, the voltage output will be",o:["unchanged","doubled","halved"],a:0,e:"NIL"},
{q:"How can the direction of rotation of a DC electric motor be changed?",o:["reverse the electrical connections to either the field or armature windings","rotate the positive brush one commutator segment","interchange the wires which connect the motor to the external power source"],a:0,e:"NIL"},
{q:"The only practical method of maintaining a constant voltage output from an aircraft generator under varying conditions of speed and load is to vary the",o:["speed at which the armature rotates","strength of the magnetic field","number of conductors in the armature"],a:1,e:"NIL"},
{q:"Electric motors are often classified according to the method of connecting the field coils and armature. Aircraft engine starter motors are generally of which type?",o:["Compound","Shunt (parallel)","Series"],a:2,e:"Series motors have the highest starting torque."},
{q:"If a heavy mechanical load is removed from a series motor",o:["the speed will increase and the armature current will increase","the speed will increase and the armature current will decrease","the speed will decrease and the armature current will decrease"],a:1,e:"Speed increases and increases the back emf which decreases the armature current."},
{q:"If the correct supply were connected to a DC shunt motor which had lost its residual magnetism it would",o:["run in the reverse direction","fail to run","run normally"],a:2,e:"Its a motor, not a generator!"},
{q:"One purpose of a growler test is to determine the presence of:",o:["a shorted armature","a broken field lead","an out-of-round commutator"],a:0,e:"NIL"},
{q:"The purpose of an end-travel microswitch in a linear actuator is to",o:["remain open and closes at end travel only","remain open during normal operation and only close if the actuator overruns its stops","remain closed and opens at end travel only"],a:2,e:"NIL"},
{q:"Linear actuators used in aircraft are of",o:["split field series wound type","compound wound type","split field shunt wound type"],a:0,e:"NIL"},
{q:"If a generator sparks, a possible reason is",o:["the brush springs are loose","magnetic flux deflecting the EMF","the brushes have been placed around the magnetic coil"],a:0,e:"NIL"},
{q:"If the field strength of a generator is doubled, and the speed is doubled, the output EMF will",o:["stay the same","double","quadruple"],a:2,e:"NIL"},
{q:"In a DC motor the pole pairs are",o:["connected to the brush gear","part of the armature","embedded within the field coils"],a:2,e:"NIL"},
{q:"A series wound DC motor, the field has",o:["few turns of thin wire","many turns of thin wire","few turns of thick wire"],a:2,e:"NIL"},
{q:"Doubling the running time of an electrical machine would",o:["double the current used","double the joules used","double the watts used"],a:1,e:"Power (watts) is the rate of using energy (Joules). So doubling running time will not change the power. Current is the rate of charge flow - so more charge (coulombs) will be used but not at a faster or slower 'rate'."},
{q:"On a linear actuator, the field cutoff coil will be energised when",o:["only as the actuator commences movement","the actuator is not running","the actuator is running"],a:2,e:"Field cutoff coil is believed to be the brake coil."},
{q:"An electric motor produces a force of 5 N at a distance of 0.2m from the centre of rotation and rotates at a speed of 100 revs/sec. The motors output is",o:["100 horsepower","628.4 watts","314.2 watts"],a:1,e:"Power in a motor = torque * 2pi * revs/sec. Torque = force * radius."},
{q:"Starter motors are usually",o:["series wound","compound wound","shunt wound"],a:0,e:"Series wound motors have the greatest starting torque."},
{q:"Generator brushes are normally made of",o:["steel","carbon","brass"],a:1,e:"NIL"},
{q:"As the generator load is increased (within its rated capacity), the voltage will",o:["remain constant and the amperage output will decrease","decrease and the amperage output will increase","remain constant and the amperage output will increase"],a:2,e:"The voltage regulator keeps the generator voltage output the same. Current will increase as the load resistance drops."},
{q:"The voltage output of a generator is controlled by",o:["varying the current of the output","varying the resistance of the output","varying the current of the field"],a:2,e:"NIL"},
{q:"The current flowing in the armature of a DC motor is equal to",o:["(applied volts - generated volts) / armature resistance","(applied volts - generated volts) * armature resistance","applied volts + generated volts / armature resistance"],a:0,e:"Ohms law I = V/R. Voltage in the armature is the applied voltage - back emf (generated voltage)."},
{q:"What device is used to convert alternating current, which has been induced into the loops of the rotating armature of a DC generator into direct current as it leaves the generator?",o:["An inverter","A commutator","A rectifier"],a:1,e:"NIL"},
{q:"Which of the following is not one of the purposes of interpoles in a generator?",o:["Overcome armature reaction","Reduce arcing at the brushes","Reduce field strength"],a:2,e:"NOT' one of the purposes. The purpose of interpoles is to overcome (in fact 'prevent') armature reaction. Armature reaction is partially responsible for arcing at the brushes."},
{q:"To reverse the direction of a series motor",o:["the direction of the current through the field and the armature is reversed","the direction of the current through the field is reversed","a second series field is fitted"],a:2,e:"NIL"},
{q:"The current consumed by a DC starter motor will",o:["remain relatively constant over the starting speed range","decrease as the engine speed increases","increase as the engine speed increases"],a:1,e:"NIL"},
{q:"How are generators rated?",o:["Impedance at rated voltage","Amperes at rated voltage","Watts at rated voltage"],a:2,e:"NIL"},
{q:"Due to armature reaction in a DC motor",o:["the leading pole tips are magnetically weakened","the trailing pole tips are magnetically weakened","the magnetic flux is restored by moving the MNA towards the GNA"],a:1,e:"NIL"},
{q:"Some electric motors have two sets of field winding wound in opposite directions so that the",o:["speed of the motor can be more closely controlled","motor can be operated in either direction","power output of the motor can be more closely controlled"],a:1,e:"Specifically series motors."},
{q:"What polarity do interpoles take in a DC motor?",o:["Either, provided they lay on the MNA","The same as the next main pole ahead in the direction of rotation","The same as the next main pole behind in the direction of rotation"],a:2,e:"The interpole must pull back the magnetic field. In a motor, the magnetic field deflects in the opposite direction to the armature."},
{q:"What is the principal advantage of the series-wound DC motor?",o:["Suitable for constant speed use","High starting torque","Low starting torque"],a:1,e:"NIL"},
{q:"Interpole windings fitted to DC series wound generators are",o:["in series with the armature","in series with the field","in parallel with the armature"],a:0,e:"Interpole windings are always in series with the armature, so they carry the same current as the armature."},
{q:"What polarity do interpoles take in a DC generator?",o:["the same as the next main pole behind in the direction of rotation","either, providing they lay on M.N.A.","the same as the next main pole ahead in the direction of rotation"],a:2,e:"On a generator, the field is deflected in the same direction as the armature rotates. The interpoles must drag back the field."},
{q:"The method most often used in overcoming the effect of armature reaction is through the use of",o:["shaded poles","interpoles","drum-wound armatures in combination with a negatively connected series field"],a:1,e:"NIL"},
{q:"The starting current of a series-wound DC motor, in passing through both the field and armature windings produces a",o:["speed slightly higher when unloaded","high starting torque","low starting torque"],a:1,e:"At low speed (i.e starting) there is a very high current in the armature (due to no back-emf). Since the field is in series with the armature, the same high current flows in it, resulting in a very high torque."},
{q:"To increase the speed of a shunt motor a resistance is placed",o:["in parallel with the field","in series with the field","in series with the armature"],a:1,e:"An apparent anomaly. Increasing the field resistance decreases the field strength which reduces the back-emf in the armature. Armature current therefore increases and its speed increases."},
{q:"A 200 volt motor is taking 10 amperes armature current, the armature resistance is 0.1 ohm. The Back-EMF under these conditions will be",o:["201 volts","199 volts","1 volt"],a:1,e:"NIL"},

{q:"A high surge of current is required when a DC electric motor is first started. As the speed of the motor increase",o:["the counter emf decreases proportionally","the applied emf increases proportionally","the counter emf builds up and opposes the applied emf, thus reducing the current flow through the armature"],a:2,e:"NIL"},
{q:"Aircraft generators are cooled by",o:["fuel cooling radiators","oil cooling radiators around the main body","ram air"],a:2,e:"NIL"},
{q:"On a combined DC starter-generator system",o:["the voltage regulator is connected to the shunt field after the start cycle is completed","the voltage regulator controls the start sequence during engine starting","the series coil is open circuit during the engine start sequence"],a:0,e:"NIL"},
{q:"If the field current to a shunt wound DC motor is decreased when operating at a constant load, the motor speed will",o:["reduce","not change","increase"],a:2,e:"This may seem strange, but decreasing the field strength of a shunt motor will decrease the back emf of the armature and hence increase the current through the armature. This in turn increases the armature speed."},
{q:"If a motor is spinning at 50 cycles per second, how long is 1 cycle of the output?",o:["50 seconds","0.83 seconds","0.02 seconds"],a:2,e:"Time period = 1/frequency."},
{q:"In a an DC motor, the rotation of the MNA",o:["is opposite to the rotation of the armature","is slightly less speed than the rotation of the armature","is the same as the rotation of the armature"],a:0,e:"The field in a motor reacts to the armature current by 'distorting' in the opposite direction to the armature - called armature reaction."},

{q:"A wire is rotated through a magnetic field. To give DC it must be connected to",o:["a commutator","slip rings","a rectifier"],a:0,e:"A commutator turns AC to DC in a generator."},
{q:"If the supply to a DC shunt motor was reversed",o:["it would rotate in the same direction","it would fail to run","it would rotate in the opposite direction"],a:0,e:"NIL"},
{q:"A series motor draws a high current on start, and then the current reduces. This is due to",o:["the resistance of the field and the armature in series","the resistance of the field and armature in parallel","the back EMF"],a:2,e:"NIL"},
{q:"Interpoles in a DC generator are connected",o:["in series with the armature","in series with the field","in parallel with the armature"],a:0,e:"NIL"},
{q:"In a DC generator, the effect of armature reaction may be reduced by moving the brush gear",o:["in the direction of armature rotation towards the MNA","from MNA to GNA","against the direction of armature rotation towards the MNA"],a:0,e:"The MNA leads the GNS in a generator. The brushes should be put on the MNA."},
{q:"The windings embedded in the pole faces of a DC generator are",o:["commutating coils","interpoles","compensating windings"],a:2,e:"NIL"},
{q:"A 6 pole wave-wound generator has",o:["3 brushes","2 brushes","6 brushes"],a:1,e:"A wave-wound generator needs only 2 brushes regardless of the number of poles, but some may have more for increased efficiency."},
{q:"Armature reaction in a DC generator causes",o:["MNA to move in the opposite direction of rotation","MNA to move in the direction of rotation","GNA to move in the direction of rotation"],a:1,e:"NIL"},

{q:"A DC generator armature has 6 poles and is lap wound. The number of brushes required are",o:["2","3","6"],a:2,e:"6 poles is 3 pairs. Lap wound generators require 1 pair of brushes for each pair of poles."},
{q:"Reactive sparking is reduced by",o:["interpoles","compensating windings","auxiliary windings"],a:0,e:"Interpoles 'reduce' armature reaction (which causes reactive sparking). Compensating windings 'prevent' armature reaction."},

{q:"The flux density of a magnetic field is 1.5T. The length of the conductor in the field is 2 m and the current flowing through the conductor is 5 amps. The force on the conductor is",o:["0.6 Newtons","15 Newtons","3.75 Newtons"],a:1,e:"F = BIl = 1.5 * 5 * 2 = 15N."},
{q:"A DC shunt motor has 28 volts applied. The current taken from the armature of 2 ohms resistance is 1 amp. The Back-EMF is",o:["26 V","30 V","27 V"],a:0,e:"Total V = I * R = 1 * 2 = 2V. So 26V B-EMF must be generated by the generator action."},

{q:"The main advantage of a starter-generator over conventional units is",o:["it can produce a greater power output","for the same power output there is a weight reduction and the starter drive remains engaged","for the same power output there is a weight reduction and the drive is constantly engaged"],a:2,e:"NIL"},
{q:"An A.C. shunt wound motor sometimes uses a volts dropping resistor. The resistor would be",o:["in series with the field","in series with the supply","in series with the armature"],a:1,e:"Must be referring to a universal motor (AC shunt wound?) The volts dropping resistor is placed in series with the supply."},
{q:"Commutator ripple can be reduced by",o:["increasing generator frequency","the use of a ripple filter","a resistor in series with the armature"],a:1,e:"A ripple filter is made of a capacitor in parallel with the generator output and an inductor in series with the generator output."},
{q:"In a DC motor the interpoles are part of the",o:["rotor assembly","stator assembly","field"],a:2,e:"Interpoles are a part of the Field. Rotor and Stator are terms for AC motors."},
{q:"Armature reaction is",o:["the MMF opposing rotation","due to dirty or worn commutator","reactive sparking"],a:0,e:"The MMF is the ampere-turns of the armature, producing a magnetic field in the armature, which opposes the main field and causes it to distort (in direction of motion of the armature)."},
{q:"A shunt motor",o:["is constant speed","has high starting torque","gives constant torque with variations in speed"],a:0,e:"DC Shunt motors are 'constant speed' motors, but starting torque is small."},
{q:"In a DC shunt motor, if the field resistance is increased what happens to the back EMF?",o:["decreases","remains the same","increases"],a:0,e:"The back EMF decreases with an increase in the field resistance. The armature current would increase and the motor speed would increase."},
{q:"To increase the voltage output of a generator you can",o:["decrease speed","It is not speed dependant","increase speed"],a:2,e:"Increasing the speed makes the armature cut the magnetic field faster, inducing a greater voltage."},
{q:"Generator voltage is",o:["dependant on speed of rotation","independent of speed of rotation","not dependant on speed of rotation"],a:0,e:"The faster the generator turns, the more voltage it produces. Besides, 'Independent' and 'not dependant' mean the same thing."},
{q:"The output from a generator to a commutator is",o:["pulsed DC","DC","AC"],a:2,e:"Output of all generators (before the commutator) is AC."},
{q:"What is the main disadvantage of a starter generator?",o:["Heavier than like for like","Will not supply output at low rpm","Can only be used on piston engines"],a:1,e:"At low RPM, starter-generator is still in motor configuration."},
{q:"Back-EMF is the greatest when a motor is",o:["at operating speed","under heavy load","just starting to rotate"],a:0,e:"Back EMF is greatest when motor is at high speed."},
{q:"When a conductor carrying a current and placed in a magnetic field it experiences",o:["an electrostatic force","an electromagnetic force","a magnetic force"],a:1,e:"The force is generated by interaction of two magnetic fields."},
{q:"The type of motor used in a linear actuator is",o:["parallel (shunt wound)","compound","series"],a:2,e:"NIL"},
{q:"If the speed of a coil in a magnetic field is doubled and the field strength is doubled the output will",o:["quadruple","stay the same","halve"],a:0,e:"Voltage = Blv. Double B (field strength) and double v (velocity) and Voltage will quadruple."},
{q:"How many brushes are used in an 8 pole wave wound machine",o:["6","8","2"],a:2,e:"Any wave wound DC generator usually has only 1 pair of brushes."},
{q:"In the shunt generator the field is supplied by",o:["the load","the armature","a separate supply"],a:1,e:"NIL"},
{q:"Increasing the speed of an aircraft generator results in an automatic",o:["field circuit resistance decrease","armature circuit resistance increase","field circuit resistance increase"],a:2,e:"NIL"},
{q:"Which generators are usually used on aircraft?",o:["Shunt","Compound","Series"],a:0,e:"NIL"},
{q:"In a cumulative compound wound generator the",o:["the series and shunt fields assist each other","the series and shunt fields oppose each other","the voltage falls suddenly with an increase in load"],a:0,e:"NIL"},
{q:"The shunt wound generator is controlled by a variable resistance in",o:["parallel with the field","series with the armature","series with the field"],a:2,e:"NIL"},
{q:"The series wound generator's terminal voltage will, when below saturation",o:["increase with an increase in load","decrease with an increase in load","decrease with a decrease in rotational speed"],a:1,e:"NIL"},
{q:"The shunt wound generator is normally started",o:["on load","Either of the above","off load"],a:2,e:"NIL"},
{q:"How do you reduce ripple on the output of a DC generator?",o:["Increase the speed of the armature and add more turns","Decrease the speed of the armature and add more series windings","Increase the commutator segments and connect each to a separate parallel winding"],a:2,e:"This amounts to increasing the separate armature windings which will increase the ripple frequency but decrease their amplitude."},
{q:"Armature reaction in a DC motor causes the neutral axis to shift in",o:["the direction in the direction of armature rotation","the direction opposite to the direction of armature rotation","either direction depending on current flow"],a:1,e:"NIL"},
{q:"An indication of good commutation on a DC machine would be",o:["high armature currents","little or no sparking at the commutator","silent operation of the machine"],a:1,e:"NIL"},
{q:"If compound DC generators are operated in parallel they must",o:["all rotate at the same speed","have an equalising or load sharing loop","all use the same voltage"],a:1,e:"NIL"},
{q:"The windings embedded in the pole faces of a generator are",o:["commutating coils","interpoles","compensating coils"],a:2,e:"NIL"},
{q:"Prolonged reactive sparking in a DC generator could damage the",o:["armature","commutator","pole pieces"],a:1,e:"NIL"},
{q:"The poles of a DC generator are laminated to",o:["reduce eddy current losses","reduce flux losses","reduce hysteresis losses"],a:2,e:"NIL"},
{q:"One advantage of a DC motor over an AC motor is",o:["the direction of rotation of the rotor can be changed","less voltage is required in DC than AC","the DC motor will use less current"],a:2,e:"Due to the generated back emf, a DC motor will use less current."},

"13. AC Theory": [
{q:"Convention requires that in a symmetrical 3 phase system, the",o:["red voltage is taken as the reference phase","yellow voltage phase leads the red phase by 120 degrees","red voltage phase leads the blue phase by 120 degrees"],a:0,e:"NIL"},
{q:"What is the phase difference in a circuit with 100V, drawing 0.5 amps, consuming 50 Watts?",o:["0°","45°","90°"],a:0,e:"When power is in Watts, it is all true power - there is no apparent power."},
{q:"The power factor of a circuit containing an imbalance of inductive and capacitive reactance is",o:["greater than unity","unity","less than unity"],a:2,e:"NIL"},
{q:"If you apply this waveform to this circuit, what is the output across the capacitor?",o:["Pulsed negative","Pulsed positive","Zero"],a:1,e:"With the output taken across the capacitor, this is a basic integrator - so the output is."},
{q:"What value is the same as the equivalent D.C. heating effect?",o:["Peak","Average","Root Mean Square"],a:2,e:"NIL"},
{q:"What shape is the waveform when the input pulse and the time base are unequal?",o:["Saw tooth","Square","Rectangular"],a:2,e:"NIL"},
{q:"A sine wave has 5 amps RMS value. What is the peak value?",o:["7.07 amps","6.37 amps","10 amps"],a:0,e:"Peak = 1.414 * RMS (also remember that 5 is half of 10)."},
{q:"What is the wave shape of the x-axis input of a traversing oscilloscope image?",o:["Rectangular","Triangular","Square"],a:1,e:"NIL"},
{q:"In a purely resistive AC circuit, the current vector is",o:["+90° out of phase with the voltage vector","in phase with the voltage vector","-90° out of phase with the voltage vector"],a:1,e:"Purely resistive - current and voltage must be in phase."},
{q:"When comparing the average values of an AC generator output, to the peak values",o:["average voltage = 0.707 * peak voltage","average voltage = 0.63 * peak voltage","average voltage = same as the peak voltage"],a:1,e:"Don't get confused with RMS value."},
{q:"A parallel circuit at resonance has",o:["maximum impedance","zero impedance","minimum impedance"],a:0,e:"A 'series' circuit at resonance has zero impedance. A 'parallel' circuit at resonance has maximum impedance."},
{q:"A 10 ohm resistor has a 14.14 V peak drop across it. What power is dissipated?",o:["10 W","19.99 W","1.414 W"],a:0,e:"Since it mentions peak, it is AC. Always use RMS voltage when calculating power. RMS voltage = peak voltage / 1.414 (more than coincidence that 14.14 / 1.414 = 10). Power = V² / R."},
{q:"If a 1 ohm circuit produces a 50 W output, the phase angle is",o:["45°","0°","90°"],a:1,e:"Going by the power being quoted in Watts (rather than VA) the circuit is purely resistive and therefore the phase angle is 0 degrees."},
{q:"What does a rectifier do?",o:["Changes alternating current into direct current","Reduces voltage","Changes direct current into alternating current"],a:0,e:"NIL"},
{q:"The ratio between apparent power and true power is the",o:["power rating","power factor","efficiency"],a:1,e:"Power factor = true power / apparent power."},
{q:"One advantage of using AC electrical power in aircraft is",o:["the greater ease in stepping the voltage up or down","AC electrical motors can be reversed while DC motors cannot","the effective voltage is 1.41 times the maximum instantaneous voltage; therefore, less power input is required"],a:1,e:"NIL"},
{q:"Unless otherwise specified, any values given for current or voltage in an AC circuit are assumed to be",o:["effective values","instantaneous values","maximum values"],a:0,e:"'Effective values' is another term for RMS because it is the same heating 'effect' as DC."},
{q:"Which aircraft circuit would be most likely to use frequency wild 200V AC?",o:["Hydraulic pump","Windscreen heating","Standby compass"],a:1,e:"Frequency wild can only be used on resistive circuits (such as heating and lighting)."},
{q:"In an AC circuit how is the value of true power calculated?",o:["By voltmeter readings multiplied by ammeter readings","By volts multiplied by amps multiplied by power factor","By watt meter readings multiplied by power factor"],a:1,e:"NIL"},
{q:"One of the chief advantages of alternating current is that it can be transmitted at a high voltage with a low power loss; the voltage can then be changed to any desired value of",o:["DC by means of transformers","DC by means of inverters","AC by means of transformers"],a:2,e:"NIL"},
{q:"How many amperes will a 28-volt generator be required to supply to a circuit containing five lamps in parallel, three of which have a resistance of 6 ohms each and two of which have a resistance of 5 ohms each?",o:["1 ampere","25.23 amperes","1.11 amperes"],a:1,e:"resistance, then use ohms law (I=V/R) to find the total current. It is a tricky calculation to do without a calculator, so round the total resistance up (to 1 ohms) then choose the nearest answer for I."},
{q:"Frequency (Hz) is the number of cycles per",o:["minute","second","revolution"],a:1,e:"NIL"},
{q:"The frequency of a power wave in an AC resistance circuit is",o:["half the frequency for voltage and current","the same as the frequency for voltage and current","twice the frequency for voltage and current"],a:2,e:"Look at a diagram of a power wave."},
{q:"In an AC circuit, the effective voltage is",o:["less than the maximum instantaneous voltage","equal to the maximum instantaneous voltage","greater than the maximum instantaneous voltage"],a:0,e:"Effective voltage is another term for RMS voltage, due to it being equal to the DC heating effect."},
{q:"Which waveform is stepped positive and negative with unequal length sides?",o:["Rectangular wave","Trapezoidal wave","Saw tooth wave"],a:1,e:"A trapezoidal waveform ALWAYS has unequal (vertical) sides. However, a sawtooth wave could also be considered to have unequal length sides (but does not necessarily have)."},
{q:"The value of an AC sine wave that will give an equivalent heating effect in a DC resistor is the",o:["peak value","RMS value","average value"],a:1,e:"NIL"},
{q:"The peak factor for a sine wave is",o:["1.11","0.707","1.414"],a:2,e:"Peak factor (sometimes called 'crest factor') is calculated by peak value / RMS value. For a sine wave it is 1.414."},
{q:"An integrated step input at unequal time base produces",o:["a sine wave","a square wave","a saw tooth wave"],a:2,e:"Integrating a step input produces a 'ramp' or sawtooth waveform."},
{q:"The mark-to-space ratio of the waveform shown is",o:["A to D / D to E","D to E / D to C","A to B / B to C"],a:0,e:"Mark-to-space is the ratio of the duration of the square wave's positive amplitude (represented by a mark) to its negative amplitude (represented by a space)."},
{q:"Form Factor for a sine wave AC output is",o:["1.1","1.414","0.707"],a:0,e:"Form Factor = RMS / Average = 0.707 / 0.63 (for a sine wave)."},
{q:"A sine wave of RMS value 7.07 volts has a peak to peak value of",o:["20.0 volts","10.0 volts","0.707 volts"],a:0,e:"Peak = RMS * 1.414. 7.07 * 1.414 = 10V. Peak-to-peak = 2 * peak = 20V."},
{q:"The true power in an AC circuit is given by",o:["volts * amps","PF * volts * amps","voltmeter reading * PF"],a:1,e:"True power = PF * Apparent power. Apparent power = volts * amps."},
{q:"The average value of 100 volts peak AC is",o:["70.7 volts","141.4 volts","63.7 volts"],a:2,e:"Average value of a sine wave is 0.637 * peak."},
{q:"The RMS value of 200 volts peak to peak is",o:["127.4 volts","70.7 volts","141.4 volts"],a:2,e:"RMS = 0.707 * peak. Peak is 1/2 of peak-to-peak."},
{q:"The power factor of an AC circuit is the",o:["cosine of the phase angle","tangent of the phase angle","sine of the phase angle"],a:0,e:"NIL"},
{q:"The Form Factor of an AC waveform can be found by",o:["RMS value divided by the average value","average value divided by the RMS value","average value times the RMS value"],a:0,e:"Form Factor = RMS / Average."},
{q:"A differentiator has a time constant which is",o:["long","equal to the input pulse","short"],a:2,e:"A differentiator provides a voltage proportional to the rate of change of the input. So for a square wave input, it needs to give a pulse on the step up, nothing on the straight bit of the square wave, then a negative pulse as the input drops back to zero. Only a very short time constant can do this."},
{q:"If the frequency is increased in an AC circuit of pure resistance, the effect is",o:["nothing","decreased resistance","increased resistance"],a:0,e:"NIL"},
{q:"What sort of wave would be used in a CR oscilloscope to control sweep?",o:["Square","Sine wave","Sawtooth"],a:2,e:"A sawtooth wave is used in an oscilloscope to control sweep."},
{q:"If an AC sine wave has an RMS value of 5V its peak value is",o:["6.37 V","7.07 V","14.14 V"],a:1,e:"Peak value = 1.414 * RMS = 1.414 * 5 = 7.07 V."},
{q:"Apparent power in an AC circuit is found by",o:["V * I * cosØ","V * I * sinØ","V * I"],a:2,e:"Apparent power = amps * volts."},
{q:"A sine wave has a periodic time of 0.5 milliseconds, what is its frequency?",o:["200 Hz","2Khz","20Khz"],a:1,e:"Frequency is 1/time period. Watch that prefix 'milli'. f = 1/T = 1/0.0005 = 10,000/5 = 2000 Hz = 2 kHz."},
{q:"Phase angle is",o:["the cosine of the peak value of an ac voltage","the difference in degrees of rotation between 2 alternating voltages or currents or a voltage and a current","the difference in degrees between the positive and negative parts of an AC sine wave"],a:1,e:"Phase angle is the difference in degrees of rotation between 2 alternating voltages or currents or a voltage and a current."},
{q:"The impedance of an AC circuit is measured in",o:["ohms","kilovolt-amperes","amperes"],a:0,e:"Impedance is 'resistance to electron flow' in an AC circuit and is measured in Ohms."},
{q:"What happens to the current in a series resistive resonant circuit?",o:["It is maximum","It is minimum","It is zero"],a:0,e:"At resonance the impedance is minimum (zero apart from the resistance in the circuit) and so current is highest."},
{q:"A circuit has 115 V RMS, 2.5A at 60 degrees, what is the power dissipated?",o:["79 W","300 VA","143 W"],a:2,e:"Apparent Power = 115 * 2.5 = 287.5. PF = cos 60 = 0.5. True Power = Apparent Power * PF."},
{q:"In a resonant parallel circuit, current is",o:["zero","minimum","maximum"],a:1,e:"At resonance in a PARALLEL circuit, current is minimum (would be zero if it were not for the resistance in the circuit)."},
{q:"Power factor is",o:["sin theta","tan theta","cos theta"],a:2,e:"Power factor is cos of the phase angle (theta)."},
{q:"Peak factor in a standard AC circuit is",o:["1.414 times max. value of applied voltage","1.11 times max. value of applied voltage","0.707 time max. value of applied voltage"],a:0,e:"Peak Factor (or Crest Factor) = Peak / RMS = 1.414 for a sinusoidal wave."},
{q:"The controlling wave in a CRT is",o:["square","sawtooth","sinusoidal"],a:1,e:"A sawtooth wave is required to control the electron beam vertical and horizontal scan."},
{q:"A wave form having equal amplitude and time base is a",o:["rectangular","sawtooth","square waveform"],a:2,e:"NIL"},
{q:"The Sine wave signals of a circular time base are",o:["in phase","phase separated by 90°","phase separated by 180°"],a:1,e:"The two sine wave time bases (X and Y) for a CRT are displaced by 90° to produce a circle on the screen."},
{q:"A differentiator has a time constant that will give",o:["a long pulse","a short pulse","a continuous output"],a:1,e:"A differentiator turns a ramp signal into a steady state (of level corresponding to the slope of the ramp)."},
{q:"What is the power factor in a purely resistive circuit?",o:["Equal to 1","Less than 1 but greater than zero","Greater than 1"],a:0,e:"NIL"}
],
"14. Resistive(R), Capacitive(C) and Inductive(L) Circuits": [
{q:"In an A.C circuit, what happens if frequency is reduced?",o:["Inductive elements may be damaged","Capacitive elements may be damaged","There will be no effect"],a:0,e:"Lower frequency will decrease the reactance of the inductor which will increase its current, possibly damaging it."},
{q:"What is the relationship between the voltage and the current in an A.C circuit containing resistance and inductance?",o:["Current lags voltage by 90°","Current lags voltage by up to 90°","Current leads voltage by up to 90°"],a:1,e:"Remember 'CIVIL'. But lag is not quite 90 degrees because of the resistance in the circuit."},
{q:"In this circuit",o:["current = voltage","current lags voltage","current leads voltage"],a:2,e:"Remember 'CIVIL'."},
{q:"Power factor relates to",o:["horsepower and Watts","KW and KVAR","true power and apparent power"],a:2,e:"Power factor = True Power / Apparent Power."},
{q:"If current lags voltage by 90°, the circuit is",o:["resistive","capacitive","inductive"],a:2,e:"Remember 'CIVIL'."},
{q:"What does the following circuit represent?",o:["Low pass filter","Differentiator","Integrator"],a:1,e:"An RC circuit with the output taken across the resistor is a differentiator."},
{q:"A low frequency supply",o:["will make the circuit operate faster due to the reduced impedance","may damage inductive components","will have no effect on inductive components"],a:1,e:"Lowering the frequency of the current through an inductive component will reduce its reactance and increase the current, possibly burning out the component."},
{q:"In a parallel R, L, C circuit, the value of the capacitor is quadrupled, then the value of the impedance would",o:["remain the same","reduce","increased"],a:1,e:"Increasing the capacitor will decrease the capacitive reactance (and therefore the impedance) - just look at the formula for capacitive reactance. This will decrease the total reactance in the parallel circuit."},
{q:"In a capacitive circuit, if the frequency is increased",o:["reactance remains the same","impedance increases","the current increases"],a:2,e:"Get the formula for capacitive reactance. The current increases because the reactance decreases."},
{q:"In the circuit shown, what happens to the total circuit impedance if L is tripled?",o:["Reduces","Increases","Remains the same"],a:1,e:"If the inductance of the inductor is tripled, then its reactance will triple which will increase the impedance of the circuit. (But not by three times - be careful)."},
{q:"In a tuned circuit at resonance, the circuit will be",o:["resistive","capacitive","inductive"],a:0,e:"In a tuned circuit, the inductive reactance and the capacitive reactances cancel each other, leaving just pure resistance."},
{q:"A circuit has a resistance of 50 ohms and an inductance of 0.2 Henry. If it is connected to a 200 volt 50 Hz supply the reactance will be",o:["31.42 ohms","62.84 ohms","6.284 ohms"],a:1,e:"Inductive reactance = 2πfL. 2 * 3.14 * 50 * 0.2 = 62.84 ohms. Since it asks for reactance (not impedance) you can neglect the resistance of 50 ohms."},
{q:"In a vector diagram showing the magnitude and direction of the inductance, capacitance and resistance in an A.C circuit",o:["the inductive and capacitance reactance would be additive with the resistance subtractive","it is impossible to show values of this kind using vectors","the inductive reactance would be in opposition to the capacitive reactance and resistance at 90 degrees"],a:2,e:"NIL"},
{q:"At resonant frequency the phase difference between the voltage and current of an AC supply feeding an inductive and capacitive network is",o:["90 degrees","0 degrees","180 degrees"],a:1,e:"NIL"},
{q:"An increase in which of the following factors will cause an increase in the inductive reactance of a circuit?",o:["Inductance and frequency","Resistance and capacitive reactance","Resistance and voltage"],a:0,e:"NIL"},
{q:"When a circuit with a series inductance and capacitance is at resonant frequency",o:["the current in the circuit decreases","the impedance of the circuit is such that the voltage is in phase with the current","the impedance of the circuit is such that the voltage leads the current by exactly 90 degrees"],a:1,e:"At resonance, the capacitive reactance and the inductive reactance cancel each other, leaving a circuit with a phase angle of zero degrees."},
{q:"A pure capacitor, inductor and resistor are connected in series and the voltage drops across each are 10V and the total current flowing in the circuit is 1A. How much true power is the circuit consuming?",o:["30VA","30W","10W"],a:2,e:"Get the formula for resonant frequency. Tricky calculation to do without a calculator though."},
{q:"If a capacitor 1µF and an inductor 10mH are connected in parallel what is their approximate resonant frequency?",o:["1.6 kHz","62 Hz","3.2 MHz"],a:0,e:"Get the formula for resonant frequency. Tricky calculation to do without a calculator though."},
{q:"Current in an inductive circuit will",o:["lag voltage","lead voltage","be at unity"],a:0,e:"Remember CIVIL."},
{q:"The impedance of a series tuned circuit at resonance is",o:["zero","minimum","maximum"],a:1,e:"NIL"},
{q:"In an inductive resistive circuit, 1 amp flows from a supply of 100V dissipating 50 Watts of power. The phase angle is",o:["60°","90°","45°"],a:0,e:"Apparent power = amps * volts = 1 * 100 = 100VA. But True power = 50W. Power Factor = TP/AP = 50/100 = 0.5. Also, PF = COSINE of phase angle. 0.5 = COSINE of phase angle. Phase angle is therefore 60 degrees."},
{q:"In the circuit shown, impedance will be",o:["5 ohms","9 ohms","7 ohms"],a:0,e:"Draw the vector diagram and find the resultant by Pythagoras - it is a 3-4-5 triangle."},
{q:"In the circuit shown, if the frequency is increased from zero to resonant frequency, the circuit current would",o:["increase","decrease","stay the same"],a:0,e:"In a series resonant circuit, the impedance is a minimum (and equal only to the resistance of the resistor in the circuit)."},
{q:"The true power developed in this circuit is",o:["20W","50W","12W"],a:2,e:"True power is only in the resistor = I²R = 2x2x3 = 12W."},
{q:"In a series LCR circuit at resonance, R = 100 ohms, L and C are each 10 ohms. The total impedance is",o:["zero ohms","100 ohms","30 ohms"],a:1,e:"Resultant reactance (XL-XC) is 10-10 = 0 ohms. So the total impedance of the circuit is the remaining 100 ohm resistor."},
{q:"In a high Q parallel resonant circuit, what happens to impedance if capacitance is increased by a factor of 4?",o:["It increases by factor of 4","It reduces by 75%","It remains the same"],a:1,e:"Impedance cannot be any higher in a parallel circuit at resonance. If capacitance is changed, circuit will no longer be at resonance and impedance will drop."},
{q:"A parallel circuit at resonance has its impedance at a",o:["maximum","zero","minimum"],a:0,e:"Parallel circuit - impedance is maximum at resonance."},
{q:"The formula for impedance in a series circuit is the root of",o:["R² + (XC-XL)²","R² - (XL-XC)²","R² + (XL-XC)²"],a:2,e:"XL is normally considered to be positive reactance and XC negative reactance. So formula is with XL-XC (not XC-XL)."},
{q:"In this circuit applied voltage is",o:["V = IXL","V = I/R","V = IXC"],a:2,e:"V = I * XC (from Ohm's Law)."},
{q:"In a parallel LCR circuit, if the capacitance is increased by 4 times, what happens to the impedance of the capacitor?",o:["increases by 4 times","remains the same","decreases by 75%"],a:2,e:"Presumably this is referring to the impedance of the capacitor alone, which would reduce to 1/4 as X = 1/2πfC. The impedance of the parallel circuit would reduce also, but how much depends upon the relative size of the other components."},
{q:"If the frequency to a capacitor increases, the current through it",o:["decreases","increases","is zero"],a:2,e:"If it really does mean 'through' it, the answer is zero, as no current goes 'through' a capacitor regardless of its frequency. However, if it means the current in the circuit, the capacitive reactance will go down, thus its current will go UP."},
{q:"If in a electrical circuit there is a difference between the capacitive reactance and the inductive reactance, what would the power factor of the circuit be?",o:["More than unity","Less than unity","Unity"],a:1,e:"Power Factor is always less than one (unity)."},
{q:"In a Series LC circuit if the value of the capacitance is increased then the power factor will be",o:["greater than 1","less than 1","equal to 1"],a:1,e:"The power factor is always less than 1 unless the circuit is at resonance."},
{q:"What is the current in the circuit with a resistance of 8 ohms, inductive reactance of 12 ohms, capacitive reactance of 18 ohms with 20 volts applied across it?",o:["10 amps","1 amp","2 amps"],a:2,e:"Calculate the total impedance Z = √(36 + 64) = 10 and then use formula V = Z * I to find current."},
{q:"A circuit containing a resistor, capacitor and inductor where resonant frequency is met, what will the impedance of the circuit be?",o:["Maximum","Resistance across the resistor","Zero"],a:1,e:"The XL and XC cancel at resonance, leaving only the R."}
],
"15. Transformers": [
{q:"How many turns does the secondary winding of a 2:1 step-up transformer have?",o:["Less than primary","More than primary","Less turns but with thicker wire"],a:1,e:"Clearly using British notation of Secondary:Primary."},
{q:"To reduce eddy currents in a transformer you would",o:["increase the thickness of laminations in the magnetic core","reduce the number of turns on the primary winding","reduce the thickness of laminations in the magnetic core"],a:2,e:"Read up on transformer losses."},
{q:"A transformer has an input of 400V and a ratio of 2:1. If the transformer is delta/star wound, what will the line voltage output be?",o:["115V","346V","200V"],a:1,e:"Star wound output - line voltage is 1.73 * phase voltage."},
{q:"A Transformer with 115V primary voltage and a ratio of 5:1 is supplying a landing light (load 24V 45 amps) is used, what is the current drawn?",o:["205 amps","4.5 amps","9 amps"],a:2,e:"When the voltage is stepped DOWN, the current has been stepped UP. So with a 45A output current on a 5:1 transformer."},
{q:"A Transformer has 4500 secondary turns and 750 primary turns. Its turns ratio is",o:["1:6","1/6","6:1"],a:2,e:"Turns ratio is Secondary:Primary (using British notation)."},
{q:"The point of coercivity occurs when the",o:["magnetic flux is zero even though a magnetizing force is being applied","magnetizing force reaches a peak positive or negative value","magnetizing force applied causes the material to become magnetically saturated"],a:0,e:"NIL"},
{q:"The primary winding of a 3-phase transformer",o:["is delta wound","could be either delta or star wound","is star wound"],a:1,e:"NIL"},
{q:"In a transformer, if the rate of change of current increases, the mutual inductance will",o:["decrease","remain the same","increase"],a:1,e:"Transformer ratio (which is dependant upon the mutual inductance) is not a function of frequency."},
{q:"A 4:1 step down transformer draws 115 V and 1 A. The output power will be",o:["460 V at 0.25 A","28.5 V at 16 A","28.5 V at 4 A"],a:2,e:"NIL"},
{q:"The secondary coil of a transformer has 1500 turns and 10 Ω resistance. The primary coil has 1kΩ resistance. How many turns does the primary coil have?",o:["15,000","1,500,000","150,000"],a:0,e:"Turns ratio = square root of the impedance ratio."},
{q:"In a star wound primary transformer, how could you wind the secondary winding?",o:["star only","either delta or star","delta only"],a:1,e:"The opposite type of winding is preferred because this reduces interference between the two. However, the connecting circuits may dictate which is used - either way, any combination is possible."},
{q:"A step up transformer has",o:["two windings","one winding","three windings"],a:0,e:"NIL"},
{q:"In a transformer core loss is 200 W and copper loss is 220W at no load. What is the core loss at full load?",o:["200 W","0 W","220 W"],a:0,e:"Since the flux is (almost) the same when on load as it is off load, the core loss is the same. (However, copper loss will be greater ON load because of the higher current)."},
{q:"The secondary winding of a transformer has an impedance of 10 ohms and 1500 turns. For the primary winding to have an impedance of 1 kilohm, how many turns must it have?",o:["15,000","1,500,000","150,000"],a:0,e:"Turns ratio = square root of impedance ratio."},

{q:"Transformer copper loss on full load is 220 Watts. On half load the loss will be",o:["440 Watts","110 Watts","55 Watts"],a:2,e:"Since copper loss is given by I²R, if the load doubles, the copper loss will quadruple. So it must have been 55 Watts on half load to be 220 Watts on full load. (Note: Core loss does not change with load)."},
{q:"How can it be determined if a transformer winding has some of its turns shorted together?",o:["measure the input voltage with an ohmmeter","the output voltage will be high","the transformer will get hot in normal operation"],a:2,e:"Copper loss (heat) is given by I²R. If some turns are shorted together, the resistance (R) goes down and the current (I) goes up. But since the current is squared, the heat loss will increase on a square law."},
{q:"Eddy currents in a transformer can be reduced by",o:["using a single solid piece of metal","laminations","using a special non metallic material"],a:1,e:"NIL"},
{q:"What is the ratio of turns between the primary coil winding and the secondary coil winding of a transformer designed to triple its input voltage?",o:["primary will have one-third as many turns as its secondary","primary will have three times as many turns as its secondary","primary will have twice as many turns as its secondary"],a:0,e:"NIL"},
{q:"A transformer should always have its",o:["primary shorted or off load","secondary shorted or on load","secondary open circuit or on load"],a:2,e:"If you short out the secondary winding, the primary will burn out."},

{q:"The voltage in a transformer secondary coil that contains twice as many loops as the primary coil will be",o:["less and the amperage greater than in the primary coil","greater and the amperage greater than in the primary coil","greater and the amperage less than in the primary coil"],a:2,e:"It is a step up transformer. The voltage is therefore stepped up and the current stepped down by the same ratio. It must do this because the power (IV) is the same in the primary and secondary (neglecting efficiency)."},
{q:"The area of a hysteresis loop is proportional to the",o:["energy dissipated in putting the material through a complete cycle of magnetization and demagnetization","relative permeability of the material being magnetized","energy absorbed in completely demagnetizing the material"],a:0,e:"NIL"},

{q:"A transformer with a 5:1 ratio has a 24V output. What is the input?",o:["120 V DC","4.8 V AC","120 V AC"],a:2,e:"5:1 is step down. So input must be 5 * 24 = 120 V. Transformers only work on AC."},

{q:"A transformer is designed to operate at 60 Hz. It is connected across a 50 Hz supply. The primary windings would",o:["draw more current","draw the same current","draw less current"],a:0,e:"The inductive reactance decreases with a decreased frequency - so it will draw MORE current."},

{q:"A transformer rated at a frequency of 200 Hz",o:["may be used at any other frequency","may only be used at the rated frequency or above","may only be used at the rated frequency or below"],a:1,e:"Since the reactance of the primary coil decreases with decreasing frequency, using below the rated frequency may damage it due to increased current flow."},

{q:"In a 4:1 step-up transformer, 120V is applied to the primary, and the load on the secondary is 1600 Ohms. What is the current in the primary?",o:["0.075A","1.2A","3A"],a:1,e:"Voltage in secondary = 4 * 120 = 480V. Current in Secondary = 480/1600 (Ohm's Law) = 3/10A. Current in Primary = 4 * 3/10A = 12/10A = 1.2A (Remember that current is stepped down Primary to Secondary in a step-up transformer)."},

// ===== ตัวแปรสถานะ =====
let currentCategory = "all";
let currentQuestions = [];
let userAnswers = {};
let submitted = false;

// ===== โหลดหมวดลงใน dropdown =====
function loadCategories() {
  const sel = document.getElementById('category');
  sel.innerHTML = '<option value="all">📚 ทุกหมวด (ทั้งหมด)</option>';
  Object.keys(quizData).forEach(cat => {
    const opt = document.createElement('option');
    opt.value = cat;
    opt.textContent = `${cat} (${quizData[cat].length} ข้อ)`;
    sel.appendChild(opt);
  });
}

// ===== ฟังก์ชันสุ่ม (Fisher-Yates) =====
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ===== เริ่มทำข้อสอบ =====
function startQuiz() {
  currentCategory = document.getElementById('category').value;
  submitted = false;
  userAnswers = {};

  // รวมคำถาม
  let pool = [];
  if (currentCategory === "all") {
    Object.keys(quizData).forEach(cat => {
      quizData[cat].forEach(q => pool.push({...q, cat: cat}));
    });
  } else {
    quizData[currentCategory].forEach(q => pool.push({...q, cat: currentCategory}));
  }

  // สุ่มลำดับคำถาม
  pool = shuffle(pool);

  // สุ่มลำดับตัวเลือกในแต่ละข้อ + เก็บ index คำตอบที่ถูกต้อง
  currentQuestions = pool.map(q => {
    const optsWithIdx = q.o.map((opt, idx) => ({text: opt, origIdx: idx}));
    const shuffledOpts = shuffle(optsWithIdx);
    const newCorrectIdx = shuffledOpts.findIndex(o => o.origIdx === q.a);
    return {
      q: q.q,
      options: shuffledOpts.map(o => o.text),
      correctIdx: newCorrectIdx,
      explanation: q.e,
      category: q.cat
    };
  });

  document.getElementById('scoreBox').style.display = 'none';
  renderQuiz();
  updateStats();
}

// ===== แสดงคำถาม =====
function renderQuiz() {
  const area = document.getElementById('quizArea');
  area.innerHTML = '';

  currentQuestions.forEach((q, idx) => {
    const div = document.createElement('div');
    div.className = 'question';
    div.id = 'q-' + idx;

    let optionsHtml = '';
    q.options.forEach((opt, oi) => {
      optionsHtml += `
        <label>
          <input type="radio" name="q${idx}" value="${oi}" onchange="onAnswer(${idx}, ${oi})">
          ${String.fromCharCode(65+oi)}. ${escapeHtml(opt)}
        </label>`;
    });

    div.innerHTML = `
      <div class="q-head">ข้อ ${idx+1}. ${escapeHtml(q.q)}</div>
      <div class="q-category">📂 ${escapeHtml(q.category)}</div>
      <div class="options">${optionsHtml}</div>
      <div class="explanation hidden" id="exp-${idx}"></div>
    `;
    area.appendChild(div);
  });

  // เพิ่มปุ่มส่งคำตอบ
  const submitBtn = document.createElement('div');
  submitBtn.style.textAlign = 'center';
  submitBtn.style.margin = '20px 0';
  submitBtn.innerHTML = `
    <button class="primary" onclick="submitQuiz()" style="padding: 12px 30px; font-size: 16px;">📝 ส่งคำตอบ</button>
    <button onclick="resetQuiz()" style="padding: 12px 30px; font-size: 16px;">🔄 ทำใหม่</button>
  `;
  area.appendChild(submitBtn);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ===== บันทึกคำตอบ =====
function onAnswer(qIdx, optIdx) {
  if (submitted) return;
  userAnswers[qIdx] = optIdx;
  updateStats();
}

// ===== อัปเดตสถิติ =====
function updateStats() {
  const catName = currentCategory === "all" ? "ทุกหมวด" : currentCategory;
  document.getElementById('catName').textContent = catName;
  document.getElementById('totalQ').textContent = currentQuestions.length;
  document.getElementById('answered').textContent = Object.keys(userAnswers).length;
}

// ===== ส่งคำตอบ =====
function submitQuiz() {
  if (Object.keys(userAnswers).length === 0) {
    alert('กรุณาตอบคำถามอย่างน้อย 1 ข้อ');
    return;
  }
  submitted = true;

  let correct = 0;
  currentQuestions.forEach((q, idx) => {
    const div = document.getElementById('q-' + idx);
    const expDiv = document.getElementById('exp-' + idx);
    const userAns = userAnswers[idx];
    const isCorrect = userAns === q.correctIdx;

    if (isCorrect) {
      correct++;
      div.classList.add('correct');
    } else {
      div.classList.add('wrong');
    }

    // แสดงเฉลย
    let expHtml = `<strong>✅ คำตอบที่ถูกต้อง:</strong> <span class="correct-answer">${String.fromCharCode(65+q.correctIdx)}. ${escapeHtml(q.options[q.correctIdx])}</span>`;
    if (!isCorrect && userAns !== undefined) {
      expHtml += `<br><strong>❌ คำตอบของคุณ:</strong> <span class="user-wrong">${String.fromCharCode(65+userAns)}. ${escapeHtml(q.options[userAns])}</span>`;
    } else if (userAns === undefined) {
      expHtml += `<br><strong>⚠️ ไม่ได้ตอบ</strong>`;
    }
    if (q.explanation && q.explanation !== "NIL") {
      expHtml += `<br><strong>💡 คำอธิบาย:</strong> ${escapeHtml(q.explanation)}`;
    }
    expDiv.innerHTML = expHtml;
    expDiv.classList.remove('hidden');

    // disable radios
    div.querySelectorAll('input[type=radio]').forEach(r => r.disabled = true);
  });

  // แสดงคะแนน
  const total = currentQuestions.length;
  const percent = Math.round((correct / total) * 100);
  let colorClass = 'red';
  if (percent >= 80) colorClass = 'green';
  else if (percent >= 60) colorClass = 'yellow';

  const scoreBox = document.getElementById('scoreBox');
  scoreBox.style.display = 'block';
  document.getElementById('scoreText').innerHTML = `
    <div style="font-size: 24px;">ตอบถูก <strong>${correct}</strong> จาก <strong>${total}</strong> ข้อ</div>
    <div style="font-size: 32px; font-weight: bold;">${percent}%</div>
  `;
  const fill = document.getElementById('progressFill');
  fill.className = 'progress-fill ' + colorClass;
  fill.style.width = percent + '%';
  fill.textContent = percent + '%';

  scoreBox.scrollIntoView({behavior: 'smooth'});
}

// ===== กรองข้อที่ถูก/ผิด =====
function filterQ(type) {
  currentQuestions.forEach((q, idx) => {
    const div = document.getElementById('q-' + idx);
    const userAns = userAnswers[idx];
    const isCorrect = userAns === q.correctIdx;

    if (type === 'all') {
      div.style.display = 'block';
    } else if (type === 'correct' && isCorrect) {
      div.style.display = 'block';
    } else if (type === 'wrong' && !isCorrect) {
      div.style.display = 'block';
    } else {
      div.style.display = 'none';
    }
  });
}

// ===== ทำใหม่ =====
function resetQuiz() {
  if (!confirm('ต้องการเริ่มทำใหม่หรือไม่? (คำตอบปัจจุบันจะหายไป)')) return;
  startQuiz();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

// ===== เริ่มต้น =====
loadCategories();
startQuiz();
</script>
